<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Watchlist</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Movie Watchlist</h1>
    <p class="intro">Movies our team wants to watch.</p>

    <form class="add" action="/add" method="post">
      <input name="title" placeholder="Movie title" required autocomplete="off" autofocus>
      <input name="genre" placeholder="Genre" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    {% if entries %}
    <table>
      <thead>
                <tr><th>Title</th><th>Genre</th><th></th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
                <tr>
          <td>{{ entry.title }}</td>
          <td>{{ entry.genre }}</td>
          <td>
            <form method="post" action="/remove/{{ entry.id }}">
              <button type="submit" class="remove">Remove</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">Nothing here yet.</p>
    {% endif %}
  </main>
</body>
</html>
